services:
  opentopodata:
    image: ajnisbet/opentopodata:1.7.0
    volumes:
      - ./opentopodata/data:/app/data:ro
      - ./opentopodata/config.yaml:/app/config.yaml:ro
    restart: unless-stopped

  gpx2real:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    image: gpx2real:${APP_IMAGE_TAG:-latest}
    depends_on:
      - opentopodata
    ports:
      - "${APP_PORT:-8080}:80"
    restart: unless-stopped
